line-length = 100
target-version = "py312"

[lint]
select = ["E", "F", "I", "UP", "B"]

[lint.per-file-ignores]
"config/settings/*.py" = ["F403", "F405"]
# Migrations are generated by makemigrations. Their line length is Django's
# to choose, and reformatting them by hand invites a diff on every regen.
"*/migrations/*.py" = ["E501"]
